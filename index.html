<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#182432"><title>Block World 2D</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79c6f4;font-family:system-ui;color:#fff;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#hud{position:fixed;inset:0;pointer-events:none}.top,.hint{position:absolute;background:#111a;padding:7px 10px;border:1px solid #ffffff55;border-radius:9px;font-size:12px;text-shadow:1px 1px #000}.top{top:7px;left:7px}.hint{top:7px;right:7px;text-align:right}.hotbar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:3px;pointer-events:auto}.slot{width:42px;height:42px;background:#222a;border:2px solid #aaa;border-radius:5px;display:grid;place-items:center;font-size:21px;position:relative}.slot.sel{border:3px solid white;background:#fff3}.slot small{position:absolute;bottom:0;right:2px;font-size:10px;text-shadow:1px 1px #000}.controls{position:absolute;bottom:65px;left:10px;display:flex;gap:8px;pointer-events:auto}.btn{width:56px;height:56px;border-radius:13px;background:#172331aa;border:2px solid #ffffffaa;display:grid;place-items:center;font-size:24px;user-select:none;touch-action:none}.right{position:absolute;bottom:65px;right:10px;display:grid;grid-template-columns:56px 56px;gap:8px;pointer-events:auto}.jump{grid-column:2}.invbtn{position:absolute;top:55px;right:8px;pointer-events:auto;padding:8px 10px;border-radius:9px;background:#182533aa;border:1px solid #fff8;font-size:12px}.inventory{position:absolute;display:none;top:50%;left:50%;transform:translate(-50%,-50%);background:#243443ee;border:3px solid #9aabb8;border-radius:12px;padding:14px;pointer-events:auto;min-width:220px}.inventory.open{display:block}.inventory h3{margin:0 0 10px}.invgrid{display:grid;grid-template-columns:repeat(4,48px);gap:6px}.invgrid .slot{width:48px;height:48px}
</style></head><body><canvas id="c"></canvas><div id="hud"><div class="top" id="stats">❤ 10　☀ День</div><div class="hint">Коснитесь блока — добыть<br>▣ — поставить</div><div class="hotbar" id="hotbar"></div><div class="controls"><div class="btn" id="left">◀</div><div class="btn" id="rightMove">▶</div></div><div class="right"><div class="btn" id="place">▣</div><div class="btn jump" id="jump">▲</div></div><button class="invbtn" id="invToggle">Инвентарь</button><div class="inventory" id="inventory"><h3>Инвентарь</h3><div class="invgrid" id="invgrid"></div><button id="closeInv" style="margin-top:10px">Закрыть</button></div></div><script>
(()=>{const c=document.getElementById('c'),ctx=c.getContext('2d'),T=32,worldW=240,worldH=90;let W,H,dpr,blocks=new Uint8Array(worldW*worldH),heights=[],camX=0,camY=0;const names=['','Трава','Земля','Камень','Дерево','Листва','Песок','Вода','Уголь','Коренная порода'],emoji=['','🟩','🟫','🪨','🪵','🌿','🟨','💧','⚫','⬛'];let inv={1:0,2:30,3:10,4:8,5:0,6:0,7:0,8:0},selected=2,px=12*T,py=0,vx=0,vy=0,onGround=false,keys={},time=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);c.width=innerWidth*dpr;c.height=innerHeight*dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);W=innerWidth;H=innerHeight}
function set(x,y,b){if(x>=0&&x<worldW&&y>=0&&y<worldH)blocks[y*worldW+x]=b}function get(x,y){if(x<0||x>=worldW||y>=worldH)return 9;if(y<0)return 0;return blocks[y*worldW+x]}
function generate(){let h=35;for(let x=0;x<worldW;x++){h+=Math.random()*2-1;h=Math.max(25,Math.min(44,h));heights[x]=Math.floor(h);for(let y=h;y<worldH;y++)set(x,y,y===h?1:y<h+5?2:3);for(let y=worldH-2;y<worldH;y++)set(x,y,9);if(Math.random()<.09&&x>4&&x<worldW-4){let th=4+Math.floor(Math.random()*3);for(let a=1;a<=th;a++)set(x,h-a,4);for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=1;dy++)if(Math.abs(dx)+Math.abs(dy)<4&&get(x+dx,h-th+dy)===0)set(x+dx,h-th+dy,5)}}for(let x=5;x<worldW-5;x++)for(let y=heights[x]+8;y<worldH-5;y++)if(Math.random()<.045)set(x,y,0)}
function texture(b,sx,sy){ctx.fillStyle=['','#62a84e','#8c5a35','#777b80','#986437','#3e873d','#d8c27a','#4b9ed8','#34363b','#25252a'][b];ctx.fillRect(sx,sy,T,T);if(b===1){ctx.fillStyle='#77c957';ctx.fillRect(sx,sy,T,7);ctx.fillStyle='#4e8c38';ctx.fillRect(sx,sy+7,T,2)}if(b===2||b===6){ctx.fillStyle=b===2?'#70452c':'#e8d58c';for(let i=0;i<5;i++)ctx.fillRect(sx+(i*7+3)%T,sy+(i*9+5)%T,3,3)}if(b===3){ctx.fillStyle='#999';ctx.fillRect(sx+5,sy+7,4,3);ctx.fillRect(sx+20,sy+21,5,4);ctx.fillStyle='#65696d';ctx.fillRect(sx+14,sy+5,3,3)}if(b===4){ctx.fillStyle='#bd8750';ctx.fillRect(sx+5,sy,3,T);ctx.fillRect(sx+20,sy,3,T)}if(b===5){ctx.fillStyle='#357d36';ctx.fillRect(sx+3,sy+5,7,6);ctx.fillRect(sx+21,sy+18,7,7);ctx.fillStyle='#4b9845';ctx.fillRect(sx+13,sy+8,5,5)}if(b===7){ctx.fillStyle='#83c6ed99';ctx.fillRect(sx,sy+5,T,5)}if(b===8){ctx.fillStyle='#111';ctx.fillRect(sx+8,sy+8,8,8);ctx.fillRect(sx+20,sy+22,5,5)}ctx.strokeStyle='#00000012';ctx.strokeRect(sx,sy,T,T)}
function player(){let x=px-camX,y=py-camY;ctx.fillStyle='#75452a';ctx.fillRect(x+7,y+2,18,12);ctx.fillStyle='#e4b487';ctx.fillRect(x+5,y+10,22,20);ctx.fillStyle='#3c68b1';ctx.fillRect(x+4,y+30,10,18);ctx.fillRect(x+17,y+30,10,18);ctx.fillStyle='#263e70';ctx.fillRect(x+3,y+45,12,5);ctx.fillRect(x+16,y+45,12,5);ctx.fillStyle='#fff';ctx.fillRect(x+19,y+15,4,4)}
function physics(){vx=(keys.left?-3.5:0)+(keys.right?3.5:0);px=Math.max(0,Math.min(worldW*T-28,px+vx));if(keys.jump&&onGround){vy=-10.5;onGround=false;keys.jump=false}vy=Math.min(12,vy+.48);py+=vy;onGround=false;let x1=Math.floor((px+4)/T),x2=Math.floor((px+26)/T),foot=Math.floor((py+50)/T);if(vy>=0&&(get(x1,foot)>0||get(x2,foot)>0)){py=foot*T-50;vy=0;onGround=true}let head=Math.floor((py+4)/T);if(vy<0&&(get(x1,head)>0||get(x2,head)>0)){py=(head+1)*T-4;vy=0}if(py>worldH*T)py=0}
function frame(){time++;ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,time%2400<1800?'#73b9f3':'#172b52');sky.addColorStop(1,time%2400<1800?'#d2efff':'#34435d');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);camX=Math.max(0,Math.min(worldW*T-W,px-W/2));camY=Math.max(0,Math.min(worldH*T-H,py-H*.55));let x0=Math.floor(camX/T),x1=Math.min(worldW,x0+Math.ceil(W/T)+2),y0=Math.floor(camY/T),y1=Math.min(worldH,y0+Math.ceil(H/T)+2);for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){let b=get(x,y);if(b)texture(b,x*T-camX,y*T-camY)}player();physics();document.getElementById('stats').textContent='❤ 10　'+(time%2400<1800?'☀ День':'☾ Ночь');requestAnimationFrame(frame)}
function buildHotbar(){let ids=[1,2,3,4,5,6,7,8],el=document.getElementById('hotbar');el.innerHTML='';ids.forEach(b=>{let s=document.createElement('div');s.className='slot'+(selected===b?' sel':'');s.innerHTML=emoji[b]+`<small>${inv[b]||0}</small>`;s.onclick=()=>{selected=b;buildHotbar()};el.appendChild(s)})}function buildInventory(){let el=document.getElementById('invgrid');el.innerHTML='';[1,2,3,4,5,6,7,8].forEach(b=>{let s=document.createElement('div');s.className='slot';s.innerHTML=emoji[b]+`<small>${inv[b]||0}</small>`;s.onclick=()=>{selected=b;buildHotbar()};el.appendChild(s)})}
function harvest(e){if(document.getElementById('inventory').classList.contains('open'))return;let tx=Math.floor((e.clientX+camX)/T),ty=Math.floor((e.clientY+camY)/T),pX=Math.floor((px+14)/T),pY=Math.floor((py+24)/T);if(Math.abs(tx-pX)>5||Math.abs(ty-pY)>5)return;let b=get(tx,ty);if(b&&b!==9){inv[b]=(inv[b]||0)+1;set(tx,ty,0);buildHotbar();buildInventory()}}
c.addEventListener('pointerdown',harvest);function bind(id,k){let el=document.getElementById(id);el.onpointerdown=e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);keys[k]=true};el.onpointerup=el.onpointercancel=()=>keys[k]=false}bind('left','left');bind('rightMove','right');bind('jump','jump');function target(){let cx=Math.floor((px+14)/T),cy=Math.floor((py+24)/T);return [cx+(keys.right?1:-1),cy]}
document.getElementById('place').onclick=()=>{let [x,y]=target();if(inv[selected]>0&&get(x,y)===0&&!(x*T>px-28&&x*T<px+28&&y*T>py-50&&y*T<py+50)){set(x,y,selected);inv[selected]--;buildHotbar();buildInventory()}};document.getElementById('invToggle').onclick=()=>{let el=document.getElementById('inventory');el.classList.toggle('open');buildInventory()};document.getElementById('closeInv').onclick=()=>document.getElementById('inventory').classList.remove('open');addEventListener('keydown',e=>{if(['ArrowLeft','a'].includes(e.key))keys.left=true;if(['ArrowRight','d'].includes(e.key))keys.right=true;if(['ArrowUp',' '].includes(e.key))keys.jump=true});addEventListener('keyup',e=>{if(['ArrowLeft','a'].includes(e.key))keys.left=false;if(['ArrowRight','d'].includes(e.key))keys.right=false;if(['ArrowUp',' '].includes(e.key))keys.jump=false});heights=new Array(worldW);generate();px=12*T;py=(heights[12]-3)*T;resize();addEventListener('resize',resize);buildHotbar();buildInventory();frame()})();</script></body></html>
